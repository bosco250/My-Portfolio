<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&amp;display=swap');
      .nav-bg { fill: #007A5C; }
      .logo-pill-border { stroke: #FFFFFF; stroke-width: 2.5; fill: none; }
      .logo-pill-text {
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-weight: 900;
        font-size: 21px;
        fill: #FFFFFF;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Green Floating Navbar Background Token (#007A5C) -->
  <rect class="nav-bg" width="64" height="64" rx="14" />

  <!-- Outlined Pill Container matching .logo-pill in Navbar -->
  <rect class="logo-pill-border" x="9" y="15" width="46" height="34" rx="17" />

  <!-- Monogram JB matching personal.initials in Navbar -->
  <text class="logo-pill-text" x="32" y="39" text-anchor="middle">JB</text>
</svg>
